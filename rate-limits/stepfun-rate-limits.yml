description: >-
  StepFun open-platform rate limits are tiered by cumulative account top-up
  amount (user levels V0-V5), each tier granting a concurrency cap, requests
  per minute (RPM), and tokens per minute (TPM). Applies to the standard
  pay-as-you-go platform APIs; Step Plan subscription usage is governed by the
  plan's monthly credit quota instead. Higher/stabler limits by request to
  platform@stepfun.com (answered within 2 business days).
sources:
  - https://platform.stepfun.com/docs/zh/guides/pricing/details
responseCodes:
  throttled: 429
