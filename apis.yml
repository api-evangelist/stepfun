aid: stepfun
name: StepFun
description: >-
  StepFun (阶跃星辰) is a Shanghai-based AI foundation-model company whose open
  platform serves the Step model family — multimodal reasoning (step-3.7-flash),
  fast language reasoning (step-3.5-flash), vision, image generation and
  editing (step-2x-large, step-image-edit-2), and a deep audio stack spanning
  TTS, voice cloning, ASR, and end-to-end realtime voice (StepAudio 2.5) — via
  an OpenAI-compatible REST API at api.stepfun.com, an Anthropic-compatible
  Messages API, WebSocket realtime channels, and a hosted StepSearch MCP
  server for agent clients.
