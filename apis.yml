- aid: stepfun:chat-completions-api
  name: StepFun Chat Completions API
  description: >-
    OpenAI-compatible chat completions for the Step model family (e.g.
    step-3.7-flash, step-3.5-flash, stepaudio-2.5-chat), with multimodal
    image/video/audio message parts, tool calling, JSON mode, streaming via
    SSE, reasoning output, and prompt caching with discounted cache-hit pricing.
  humanURL: https://platform.stepfun.com/docs/zh/api-reference/chat/chat-completion-create
